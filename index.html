<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎄 Christmas Letter Draw 🎄</title>

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* Page */
body{

    font-family:Arial, sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding-top:42vh;

    background:black;

    color:white;

    overflow:hidden;
}

/* Background Image */
.bg{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:black;

    z-index:-2;
}

/* Overlay */
.overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.25);

    z-index:-1;
}

/* Panel */
.container{

    width:75%;
    max-width:420px;

    padding:25px;

    text-align:center;

    background:rgba(0,0,0,0.45);

    backdrop-filter:blur(10px);

    border-radius:20px;

    border:2px solid rgba(255,255,255,0.15);

    box-shadow:
        0 0 20px rgba(255,255,255,0.20);
}

/* Heading */
h1{

    font-size:1.6rem;

    margin-bottom:10px;
}

/* Letter */
#letter{

    font-size:7rem;

    font-weight:bold;

    margin:10px 0;

    color:white;

    text-shadow:
        0 0 10px white,
        0 0 20px white,
        0 0 40px white;
}

/* Green after locked */
.locked{

    color:#00ff66;

    text-shadow:
        0 0 10px #00ff66,
        0 0 20px #00ff66,
        0 0 40px #00ff66,
        0 0 60px #00ff66;
}

/* Buttons */
button{

    border:none;

    padding:12px 24px;

    font-size:1rem;

    margin:6px;

    border-radius:12px;

    cursor:pointer;

    transition:0.3s;
}

.random{
    background:#FFD700;
    color:black;
}

.lock{
    background:#D4001A;
    color:white;
}

button:hover{
    transform:scale(1.05);
}

.footer{

    margin-top:15px;

    font-size:0.8rem;

    opacity:0.85;
}

</style>

</head>

<body>

<!-- Background Image -->
<img src="background.jpg" class="bg">

<!-- Dark Overlay -->
<div class="overlay"></div>

<!-- Main Panel -->
<div class="container">

    <h1>🎄 Letter Draw 🎄</h1>

    <div id="letter">A</div>

    <button class="random"
            onclick="randomLetter()">
        🎲 Shuffle
    </button>

    <button class="lock"
            onclick="lockLetter()">
        🔒 Lock
    </button>

    <div class="footer">
        ❄ Merry Christmas ❄
    </div>

</div>

<script>

let isLocked = false;

/* Generate random letter */
function randomLetter(){

    if(isLocked) return;

    const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const random =
        letters[
            Math.floor(
                Math.random()*letters.length
            )
        ];

    document
        .getElementById("letter")
        .innerHTML = random;
}

/* Lock selected letter */
function lockLetter(){

    if(isLocked) return;

    isLocked = true;

    document
        .getElementById("letter")
        .classList
        .add("locked");

    alert(
        "🎄 Merry Christmas!\n\nYour letter has been locked."
    );
}

/* Initial letter */
randomLetter();

</script>

</body>
</html>
