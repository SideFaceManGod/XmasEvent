<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎄 Letter Draw 🎄</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            rgba(0,0,0,0.4),
            rgba(0,0,0,0.4)
        ),
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
}

.container{

    background:rgba(0,0,0,0.4);

    backdrop-filter:blur(10px);

    border-radius:25px;

    padding:40px 30px;

    width:90%;
    max-width:500px;

    text-align:center;

    border:2px solid rgba(255,255,255,0.2);

    box-shadow:0 0 20px rgba(255,255,255,0.2);
}

h1{
    font-size:2rem;
    margin-bottom:20px;
}

#letter{

    font-size:9rem;
    font-weight:bold;
    margin:20px 0;

    color:white;

    text-shadow:
        0 0 10px #ffffff,
        0 0 20px #ffffff,
        0 0 40px #ffffff;
}

button{

    border:none;

    padding:15px 30px;

    font-size:1.3rem;

    margin:10px;

    border-radius:15px;

    cursor:pointer;

    transition:all 0.3s ease;
}

.random{

    background:#FFD700;
    color:black;
}

.random:hover{

    transform:scale(1.05);
}

.lock{

    background:#D4001A;
    color:white;
}

.lock:hover{

    transform:scale(1.05);
}

.locked{

    color:#00ff66;

    text-shadow:
        0 0 10px #00ff66,
        0 0 20px #00ff66,
        0 0 40px #00ff66;
}

.footer{

    margin-top:20px;
    font-size:0.9rem;
    opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

    <h1>🎄 Christmas Letter Draw 🎄</h1>

    <div id="letter">A</div>

    <button class="random" onclick="randomLetter()">
        🎲 Shuffle
    </button>

    <button class="lock" onclick="lockLetter()">
        🔒 Lock
    </button>

    <div class="footer">
        ❄ Merry Christmas ❄
    </div>

</div>

<script>

let isLocked = false;

function randomLetter(){

    if(isLocked){
        return;
    }

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const random =
        letters[
            Math.floor(
                Math.random()*letters.length
            )
        ];

    document.getElementById("letter").innerHTML = random;
}

function lockLetter(){

    isLocked = true;

    document.getElementById("letter")
        .classList.add("locked");

    alert(
        "🎄 Merry Christmas!\n\nYour letter has been locked."
    );
}

randomLetter();

</script>

</body>

</html>
