<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Mobile friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>🎄 Christmas Letter Draw 🎄</title>

    <style>

        /* =====================================
           RESET DEFAULT BROWSER SETTINGS
        ====================================== */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        /* =====================================
           PAGE LAYOUT
        ====================================== */
        body{

            font-family:Arial, sans-serif;

            min-height:100vh;

            display:flex;

            justify-content:center;

            /* Move panel towards lower portion */
            align-items:flex-start;

            /* Adjust this value if needed */
            padding-top:28vh;

            background:black;

            color:white;

            overflow:hidden;
        }

        /* =====================================
           BACKGROUND IMAGE
        ====================================== */
        .bg{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            /* Show whole image */
            object-fit:contain;

            background:black;

            z-index:-2;
        }

        /* =====================================
           DARK OVERLAY
        ====================================== */
        .overlay{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.25);

            z-index:-1;
        }

        /* =====================================
           MAIN PANEL
        ====================================== */
        .container{

            width:65%;

            max-width:320px;

            min-height:340px;

            padding:30px 20px;

            text-align:center;

            background:rgba(0,0,0,0.50);

            backdrop-filter:blur(10px);

            border-radius:25px;

            border:2px solid rgba(255,255,255,0.15);

            box-shadow:
                0 0 20px rgba(255,255,255,0.20);
        }

        /* =====================================
           TITLE
        ====================================== */
        h1{

            font-size:1.6rem;

            margin-bottom:15px;
        }

        /* =====================================
           LETTER DISPLAY
        ====================================== */
        #letter{

            font-size:7rem;

            font-weight:bold;

            margin:20px 0;

            color:white;

            transition:all 0.4s ease;

            text-shadow:
                0 0 10px white,
                0 0 20px white,
                0 0 40px white;
        }

        /* =====================================
           LOCKED LETTER STYLE
        ====================================== */
        #letter.locked{

            color:#00ff66 !important;

            text-shadow:
                0 0 10px #00ff66,
                0 0 20px #00ff66,
                0 0 40px #00ff66,
                0 0 60px #00ff66;
        }

        /* =====================================
           BUTTON STYLE
        ====================================== */
        button{

            border:none;

            padding:12px 22px;

            font-size:1rem;

            margin:6px;

            border-radius:12px;

            cursor:pointer;

            transition:all 0.25s ease;
        }

        button:hover{

            transform:scale(1.05);
        }

        /* =====================================
           SHUFFLE BUTTON
        ====================================== */
        .random{

            background:#FFD700;

            color:black;

            font-weight:bold;
        }

        /* =====================================
           LOCK BUTTON
        ====================================== */
        .lock{

            background:#D4001A;

            color:white;

            font-weight:bold;
        }

        /* =====================================
           DISABLED BUTTON STYLE
        ====================================== */
        button:disabled{

            opacity:0.5;

            cursor:not-allowed;

            transform:none;
        }

        /* =====================================
           FOOTER
        ====================================== */
        .footer{

            margin-top:25px;

            font-size:0.85rem;

            opacity:0.85;
        }

    </style>

</head>

<body>

    <!-- Background image -->
    <img src="background.jpg" class="bg" alt="Christmas Background">

    <!-- Dark overlay -->
    <div class="overlay"></div>

    <!-- Main content panel -->
    <div class="container">

        <!-- Title -->
        <h1>🎄 Letter Draw 🎄</h1>

        <!-- Random letter display -->
        <div id="letter">A</div>

        <!-- Shuffle button -->
        <button
            id="shuffleBtn"
            class="random"
            onclick="randomLetter()">
            🎲 Shuffle
        </button>

        <!-- Lock button -->
        <button
            id="lockBtn"
            class="lock"
            onclick="lockLetter()">
            🔒 Lock
        </button>

        <!-- Footer -->
        <div class="footer">
            ❄ Merry Christmas ❄
        </div>

    </div>

    <script>

        /* =====================================
           LOCK STATUS
        ====================================== */
        let isLocked = false;

        /* =====================================
           GENERATE RANDOM LETTER
        ====================================== */
        function randomLetter(){

            if(isLocked){
                return;
            }

            const letters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            const randomLetter =
                letters[
                    Math.floor(
                        Math.random() * letters.length
                    )
                ];

            document.getElementById("letter").textContent =
                randomLetter;
        }

        /* =====================================
           LOCK CURRENT LETTER
        ====================================== */
        function lockLetter(){

            if(isLocked){
                return;
            }

            isLocked = true;

            const letter =
                document.getElementById("letter");

            /* Change letter to green glow */
            letter.classList.add("locked");

            /* Disable buttons */
            document.getElementById("shuffleBtn").disabled = true;
            document.getElementById("lockBtn").disabled = true;

            /* Confirmation popup */
            alert(
                "🎄 Merry Christmas!\n\nYour letter has been locked!"
            );
        }

        /* =====================================
           SHOW RANDOM LETTER WHEN PAGE LOADS
        ====================================== */
        randomLetter();

    </script>

</body>

</html>
