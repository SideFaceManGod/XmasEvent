<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Christmas Letter Draw</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #0d5c31,
        #168039
    );
    color:white;
    text-align:center;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    margin:0;
}

h1{
    font-size:2rem;
}

#letter{
    font-size:10rem;
    font-weight:bold;
    margin:30px;
}

button{
    font-size:1.5rem;
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}

.random{
    background:#f4c542;
}

.lock{
    background:#e63946;
    color:white;
}

.locked{
    color:#f4c542;
}
</style>

</head>
<body>

<h1>🎄 Christmas Letter Draw 🎄</h1>

<div id="letter">A</div>

<div>
    <button class="random" onclick="randomLetter()">
        🎲 Random
    </button>

    <button class="lock" onclick="lockLetter()">
        🔒 Lock
    </button>
</div>

<script>

let isLocked = false;

function randomLetter(){

    if(isLocked) return;

    let letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let random =
        letters[Math.floor(
            Math.random()*letters.length
        )];

    document.getElementById("letter").innerHTML = random;
}

function lockLetter(){

    isLocked = true;

    document.getElementById("letter")
        .classList.add("locked");

    alert(
      "🎄 Merry Christmas!\nYour letter is locked."
    );
}

randomLetter();

</script>

</body>
</html>
